# This file is included in nginx's http context by the official container.
map $uri $portal_cache_control {
    default "public, max-age=0, must-revalidate";
    "~^/[^/]+\.[0-9a-f]{8}\.js$" "public, max-age=31536000, immutable";
}

server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $portal_cache_control;

    # A missing chunk must fail as a file request, rather than return SPA HTML.
    location ~* \.(?:js|css|json|map|woff2?|ttf|otf|png|jpe?g|svg|gif|ico|webp|pdf)$ {
        try_files $uri =404;
    }

    # Accept either gateway behavior: preserve /frontend/ or strip it upstream.
    location = /frontend { return 308 /frontend/; }
    location ^~ /frontend/ {
        rewrite ^/frontend/(.*)$ /$1 last;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
